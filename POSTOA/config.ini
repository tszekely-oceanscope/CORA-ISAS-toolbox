[analysis]
# Oceanographic variable to process
var_name = TEMP

[paths]
# XML configuration file for the OA analysis
config_fname = ./PREOA/configfile/conf_isasana_MY_OA.xml

# Root directory for climatology and atlas files
climpath = /path/to/climato

# Climatology file — {climpath}, {year}, {month} (zero-padded), {var} substituted at runtime
clim_template = {climpath}/{year}/woa23_ISASgrid_m{month}_{var}.nc

# Atlas pressure file — {climpath}, {month} (zero-padded) substituted at runtime
atlas_pres_template = {climpath}/WOA18FD_A5B7_m{month}_PRES.nc

# Fallback source OA data directory (overridden by --input)
dir_oa_data = /path/to/oa/data/

# Fallback POSTOA output directory (overridden by --output)
dir_postoa = /path/to/postoa/output/
