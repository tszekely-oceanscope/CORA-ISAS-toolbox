[analysis]
# Oceanographic variable to process
var_name = TEMP

[paths]
# XML configuration file for the OA analysis
config_fname = ./PREOA/configfile/conf_isasana_MY_OA.xml

# Climatology file — {year}, {month} (zero-padded), {var} are substituted at runtime
clim_template = {climpath}/{year}/woa23_ISASgrid_m{month}_{var}.nc

# Atlas pressure file — {month} (zero-padded) is substituted at runtime
atlas_pres_template = {climpath}/WOA18FD_A5B7_m{month}_PRES.nc

# Source OA data directory (must end with /)
dir_oa_data =./OA/data/

# Destination POSTOA data directory (must end with /)
dir_postoa = {OAdir}/ISAS_RESU/POSTOA_DATA/
